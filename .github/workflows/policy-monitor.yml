name: Orbyte Official Policy Monitor

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      acknowledge_detected_changes:
        description: 'Clear reviewed change flags only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: orbyte-policy-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find project and monitor official sources
        env:
          ACKNOWLEDGE_POLICY_CHANGES: ${{ inputs.acknowledge_detected_changes || false }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=$(find . -type f \
            -path '*/policy-monitoring/policy_monitor_github.mjs' \
            -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "::error::Policy monitor script not found."
            exit 1
          fi

          PROJECT_DIR="${SCRIPT%/policy-monitoring/policy_monitor_github.mjs}"

          if [ ! -f "$PROJECT_DIR/policy-monitoring/package.json" ]; then
            echo "::error::Policy monitor package.json not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          npm install \
            --prefix "$PROJECT_DIR/policy-monitoring" \
            --no-package-lock \
            --no-audit \
            --no-fund

          if node "$SCRIPT"; then
            MONITOR_EXIT=0
          else
            MONITOR_EXIT=$?
          fi

          if [ "$MONITOR_EXIT" -eq 2 ]; then
            STATUS_FILE="$PROJECT_DIR/public/policy-monitoring/status.json"

            if [ -f "$STATUS_FILE" ] && node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.exit(Array.isArray(s.failedDocuments)&&s.failedDocuments.length===0?0:1)' "$STATUS_FILE"; then
              echo "::warning::Some official portal checks failed, but no monitored PDF document failures were recorded. Review the generated report."
              exit 0
            else
              echo "::error::One or more monitored PDF documents failed, or the status file could not be validated."
              exit 2
            fi
          elif [ "$MONITOR_EXIT" -ne 0 ]; then
            exit "$MONITOR_EXIT"
          fi

      - name: Save monitoring results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=$(find . -type f \
            -path '*/policy-monitoring/policy_monitor_github.mjs' \
            -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "Monitor script unavailable; nothing to commit."
            exit 0
          fi

          PROJECT_DIR="${SCRIPT%/policy-monitoring/policy_monitor_github.mjs}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$PROJECT_DIR/policy-monitoring/state.json" \
            "$PROJECT_DIR/public/policy-monitoring/status.json" \
            "$PROJECT_DIR/public/policy-monitoring/latest-report.md"

          if ! git diff --cached --quiet; then
            git commit -m "chore(policy-monitor): update official source status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No monitoring output changes."
          fi

name: Orbyte Policy Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4,16 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./orbyte-hub-github-actions-no-billing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run policy monitor
        id: monitor
        continue-on-error: true
        run: |
          node scripts/policy-monitor.mjs
          echo "Monitor exit code: $?"

      - name: Verify monitoring output
        run: |
          test -f public/policy-monitoring/status.json
          test -f public/policy-monitoring/latest-report.md

          echo "Monitoring output found:"
          ls -lh public/policy-monitoring/

      - name: Upload monitoring results
        uses: actions/upload-artifact@v4
        with:
          name: orbyte-policy-monitoring-${{ github.run_number }}
          path: |
            orbyte-hub-github-actions-no-billing/public/policy-monitoring/status.json
            orbyte-hub-github-actions-no-billing/public/policy-monitoring/latest-report.md
            orbyte-hub-github-actions-no-billing/public/policy-monitoring/state.json
          if-no-files-found: warn
          retention-days: 30
